<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Task Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

    <!-- LOGIN CONTAINER -->
    <div id="loginSection" class="container mt-5" style="max-width: 400px;">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="text-center mb-4">🔐 Login Sistem</h3>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control">
                </div>
                <button class="btn btn-primary w-100" onclick="login()">Masuk</button>
            </div>
        </div>
    </div>

    <!-- DASHBOARD CONTAINER -->
    <div id="dashboardSection" class="container py-4" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📊 Dashboard Manajemen Tugas</h2>
            <div>
                <span id="userInfo" class="fw-bold me-3"></span>
                <button class="btn btn-danger btn-sm" onclick="logout()">Keluar</button>
            </div>
        </div>

        <!-- Toast Notifikasi Web -->
        <div id="webToast" class="alert alert-success alert-dismissible fade show" role="alert" style="display:none;">
            <span id="toastMsg"></span>
        </div>

        <!-- Visualisasi Chart -->
        <div class="row mb-4">
            <div class="col-md-6 mx-auto">
                <div class="card shadow-sm p-3">
                    <h5 class="text-center">Statistik Status Tugas</h5>
                    <canvas id="taskChart" style="max-height: 250px;"></canvas>
                </div>
            </div>
        </div>

        <!-- Tombol Tambah Task khusus Admin -->
        <div id="adminActionPanel" class="mb-3" style="display: none;">
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addTaskModal">+ Tambah Tugas Divisi</button>
        </div>

        <!-- Tabel Task -->
        <div class="card shadow-sm">
            <div class="card-body table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Divisi</th>
                            <th>Nama Task</th>
                            <th>Detail</th>
                            <th>PIC</th>
                            <th>Start Date</th>
                            <th>Due Date</th>
                            <th>End Date</th>
                            <th>Status</th>
                            <th>File</th>
                            <th>Keterangan</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Tambah Task -->
    <div class="modal fade" id="addTaskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Tambah Tugas Baru</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nama Task</label>
                        <input type="text" id="add_task_name" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Detail Task</label>
                        <textarea id="add_task_detail" class="form-control"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">PIC (Username)</label>
                        <input type="text" id="add_pic" class="form-control" placeholder="Masukkan username PIC terkait">
                    </div>
                    <button class="btn btn-primary w-100" onclick="submitAddTask()">Simpan Tugas</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzISwYZSmSTs8oQ109OvlKch7vkgeBqPDKuUgYjGG_wQ6L83F8j8sQkQ3GSesyZtCGO/exec";
        let currentUser = null;
        let myChart = null;

        function showToast(msg) {
            let toast = document.getElementById("webToast");
            document.getElementById("toastMsg").innerText = msg;
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 4000);
        }

        function login() {
            let u = document.getElementById("username").value;
            let p = document.getElementById("password").value;

            fetch(`${WEB_APP_URL}?action=login&username=${u}&password=${p}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        currentUser = data;
                        document.getElementById("loginSection").style.display = "none";
                        document.getElementById("dashboardSection").style.display = "block";
                        document.getElementById("userInfo").innerText = `${data.nama} (${data.role} - ${data.divisi})`;
                        
                        if (data.role === "MasterAdmin" || data.role === "AdminDivisi") {
                            document.getElementById("adminActionPanel").style.display = "block";
                        }
                        loadTasks();
                    } else {
                        alert(data.message);
                    }
                });
        }

        function logout() {
            currentUser = null;
            location.reload();
        }

        function loadTasks() {
            fetch(`${WEB_APP_URL}?action=getTasks&role=${currentUser.role}&divisi=${currentUser.divisi}&username=${currentUser.username}`)
                .then(res => res.json())
                .then(data => {
                    let tbody = document.getElementById("taskTableBody");
                    tbody.innerHTML = "";
                    
                    let countStatus = { "To Do": 0, "On Progress": 0, "Success": 0 };

                    data.forEach(task => {
                        if(countStatus[task.Status] !== undefined) countStatus[task.Status]++;
                        else countStatus[task.Status] = 1;

                        let actionBtn = "";
                        if (currentUser.role === 'PIC' && task.PIC === currentUser.username) {
                            actionBtn = `<button class="btn btn-sm btn-warning" onclick="updateTaskPIC('${task["Task ID"]}')">Update Progres</button>`;
                        } else if (currentUser.role === 'MasterAdmin' || currentUser.role === 'AdminDivisi') {
                            actionBtn = `<button class="btn btn-sm btn-info text-white" onclick="updateTaskAdmin('${task["Task ID"]}')">Review Admin</button>`;
                        }

                        let row = `<tr>
                            <td>${task["Task ID"]}</td>
                            <td>${task.Divisi}</td>
                            <td>${task["Task Name"]}</td>
                            <td>${task["Task Detail"]}</td>
                            <td>${task.PIC}</td>
                            <td>${task["Start Date"] || '-'}</td>
                            <td>${task["Due Date"] || '-'}</td>
                            <td>${task["End Date"] || '-'}</td>
                            <td><span class="badge bg-secondary">${task.Status}</span></td>
                            <td>${task["File Link"] ? `<a href="${task["File Link"]}" target="_blank">Lihat File</a>` : '-'}</td>
                            <td>${task.Keterangan || '-'}</td>
                            <td>${actionBtn}</td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                    updateChart(countStatus);
                });
        }

        function submitAddTask() {
            let data = {
                action: "addTask",
                task_name: document.getElementById("add_task_name").value,
                task_detail: document.getElementById("add_task_detail").value,
                pic: document.getElementById("add_pic").value,
                divisi: currentUser.divisi // Otomatis mengisi divisi sesuai admin yang login
            };

            fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(data) })
                .then(res => res.json()).then(res => {
                    showToast("Tugas berhasil ditambahkan!");
                    bootstrap.Modal.getInstance(document.getElementById('addTaskModal')).hide();
                    loadTasks();
                });
        }

        function updateTaskPIC(taskId) {
            let startDate = prompt("Masukkan Tanggal Mulai (YYYY-MM-DD):");
            let endDate = prompt("Masukkan Tanggal Selesai (YYYY-MM-DD):");
            let fileLink = prompt("Masukkan Link Google Drive File/Lampiran (Opsional):");

            let data = {
                action: "updatePIC",
                task_id: taskId,
                start_date: startDate,
                end_date: endDate,
                file_link: fileLink
            };

            fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(data) })
                .then(res => res.json()).then(res => {
                    showToast("Progres berhasil diperbarui!");
                    loadTasks();
                });
        }

        function updateTaskAdmin(taskId) {
            let status = prompt("Ubah Status (Success / Rejected):", "Success");
            let ket = prompt("Masukkan Keterangan / Catatan Admin:");

            let data = {
                action: "updateAdmin",
                task_id: taskId,
                status: status,
                keterangan: ket
            };

            fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(data) })
                .then(res => res.json()).then(res => {
                    showToast("Review Admin berhasil disimpan & email terkirim!");
                    loadTasks();
                });
        }

        function updateChart(stats) {
            const ctx = document.getElementById('taskChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(stats),
                    datasets: [{
                        data: Object.values(stats),
                        backgroundColor: ['#ffc107', '#0dcaf0', '#198754']
                    }]
                }
            });
        }
    </script>
</body>
</html>
